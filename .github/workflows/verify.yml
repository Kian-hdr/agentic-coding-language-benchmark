name: Verify benchmark evidence
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/verify.py --full
      - run: python scripts/analyze.py --check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_public.py
      - if: runner.os != 'Windows'
        run: python scripts/reproduce.py build python
      - if: runner.os != 'Windows'
        run: python scripts/reproduce.py validate python
